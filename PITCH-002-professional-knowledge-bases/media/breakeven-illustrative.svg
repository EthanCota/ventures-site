<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <style>
    .ink   { fill:#16233a; }
    .ink2  { fill:#52514e; }
    .muted { fill:#898781; }
    .bar   { fill:#2a78d6; }
    .grid  { stroke:#e1e0d9; stroke-width:1; }
    .axis  { stroke:#c3c2b7; stroke-width:1; }
    .refline { stroke:#52514e; stroke-width:2; stroke-dasharray:5 4; }
    text { font-size:13px; }
    .lbl  { font-size:12.5px; }
    .val  { font-size:13.5px; font-weight:600; }
    .h1   { font-size:15px; font-weight:600; }
    .cap  { font-size:11.5px; }
    @media (prefers-color-scheme: dark){
      .ink   { fill:#f5f1ea; }
      .ink2  { fill:#c9c2b5; }
      .muted { fill:#8b8a84; }
      .bar   { fill:#3987e5; }
      .grid  { stroke:#2c2c2a; }
      .axis  { stroke:#383835; }
      .refline { stroke:#c9c2b5; }
      rect.bg { fill:#1a2130; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="24" y="30" class="h1 ink">Staff time saved vs. monthly cost — illustrative example</text>
  <text x="24" y="50" class="cap ink2">Not a measured result. Scenario math only, at a $35/hr loaded staff rate ×
4.33 weeks/month.</text>

  <!-- gridlines -->
  <line x1="90" y1="330" x2="680" y2="330" class="axis"/>
  <line x1="90" y1="90" x2="90" y2="330" class="axis"/>
  <g class="grid">
    <line x1="90" y1="270" x2="680" y2="270"/>
    <line x1="90" y1="210" x2="680" y2="210"/>
    <line x1="90" y1="150" x2="680" y2="150"/>
    <line x1="90" y1="90"  x2="680" y2="90"/>
  </g>
  <text x="80" y="334" text-anchor="end" class="lbl muted">$0</text>
  <text x="80" y="274" text-anchor="end" class="lbl muted">$200</text>
  <text x="80" y="214" text-anchor="end" class="lbl muted">$400</text>
  <text x="80" y="154" text-anchor="end" class="lbl muted">$600</text>
  <text x="80" y="94"  text-anchor="end" class="lbl muted">$800</text>

  <!-- reference line: $400/mo blended cost -->
  <line x1="90" y1="210" x2="680" y2="210" class="refline"/>
  <text x="600" y="202" class="lbl ink2" text-anchor="end">$400/mo — blended service cost</text>

  <!-- bars: 1hr=$150, 2.5hr=$375, 5hr=$750, scale 300px = $800 -->
  <g>
    <rect x="160" y="285" width="80" height="45" rx="4" class="bar"/>
    <text x="200" y="346" text-anchor="middle" class="lbl ink2">1 hr/week saved</text>
    <text x="200" y="278" text-anchor="middle" class="val ink">~$150/mo</text>

    <rect x="360" y="217.5" width="80" height="112.5" rx="4" class="bar"/>
    <text x="400" y="346" text-anchor="middle" class="lbl ink2">2.5 hrs/week saved</text>
    <text x="400" y="210.5" text-anchor="middle" class="val ink">~$375/mo</text>

    <rect x="560" y="105" width="80" height="225" rx="4" class="bar"/>
    <text x="600" y="346" text-anchor="middle" class="lbl ink2">5 hrs/week saved</text>
    <text x="600" y="98" text-anchor="middle" class="val ink">~$750/mo</text>
  </g>

  <text x="24" y="384" class="cap muted">ILLUSTRATIVE EXAMPLE — hypothetical scenario, not a customer measurement.
Assumptions (loaded staff rate, blended cost) are this pitch's own derived figures — see STRATEGY.md §2, not independently sourced.</text>
</svg>
